name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_tag=$(git tag -l 'v*' --points-at HEAD | head -n 1)

          if [ "$EVENT_NAME" != "push" ] || [ "$REF" != "refs/heads/main" ] || [ -n "$head_tag" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$latest_tag" ]; then
            echo "version=v1.0.0" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_version=${latest_tag#v}
          major_minor=${latest_version%.*}
          patch=${latest_version##*.}
          next_patch=$((patch + 1))

          echo "version=v$major_minor.$next_patch" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (x86)
    runs-on: windows-latest
    needs: version
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build
        shell: bash
        run: |
          xmake f -p windows -a x86 -m release -y
          xmake

      - name: Test
        shell: bash
        run: |
          xmake build sigtest
          xmake run sigtest

      - name: Package
        shell: bash
        run: |
          mkdir -p package/addons
          cp build/windows/x86/release/csgo-multi-appid.dll package/addons/
          cp csgo-multi-appid.vdf package/addons/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: csgo-multi-appid-windows
          path: ./package

  linux:
    name: Linux (i386)
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    needs: version
    env:
      PLUGIN_VERSION: ${{ needs.version.outputs.version }}
      # GitHub Actions runs job containers as root, and current xmake refuses
      # to do anything as root without this.
      XMAKE_ROOT: y

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build
        run: |
          # The container runs as a different user than the checkout, and git
          # refuses to touch a repo it thinks belongs to someone else.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          xmake f -p linux -a i386 -m release -y
          xmake

      - name: Test
        run: |
          xmake build sigtest
          xmake run sigtest

      - name: Check glibc floor
        run: |
          objdump -T build/linux/i386/release/csgo-multi-appid.so | grep -o 'GLIBC_[0-9.]*' | sort -V -u | tail -1

      - name: Package
        run: |
          mkdir -p package/addons
          cp build/linux/i386/release/csgo-multi-appid.so package/addons/
          cp csgo-multi-appid.vdf package/addons/

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: csgo-multi-appid-linux
          path: ./package

  release:
    name: Release
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version, windows, linux]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: csgo-multi-appid-windows
          path: windows

      - uses: actions/download-artifact@v4
        with:
          name: csgo-multi-appid-linux
          path: linux

      - name: Package
        run: |
          mkdir -p releases
          (cd windows && zip -r ../releases/csgo-multi-appid-windows.zip .)
          (cd linux && zip -r ../releases/csgo-multi-appid-linux.zip .)
          mkdir -p combined/addons
          cp windows/addons/csgo-multi-appid.dll combined/addons/
          cp linux/addons/csgo-multi-appid.so combined/addons/
          cp csgo-multi-appid.vdf combined/addons/
          (cd combined && zip -r ../releases/csgo-multi-appid.zip .)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: releases/*
          generate_release_notes: true
          prerelease: false
